[tool.poetry]
name = "parsbench"
version = "0.3.0"
description = "ParsBench provides toolkits for benchmarking LLMs based on the Persian language tasks."
authors = ["Shahriar Shariati <shahriarshm81@gmail.com>"]
readme = "README.md"
license = "Apache-2.0"
homepage = "https://parsbench.github.io/ParsBench"
repository = "https://github.com/ParsBench/ParsBench"
documentation = "https://parsbench.github.io/ParsBench"
keywords = ["llm", "benchmarking", "persian"]
classifiers = [
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
    "Natural Language :: Persian",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only"
]
packages = [{include = "parsbench"}]
# ship the viewer SPA (non-Python files) in both distributions
include = [{ path = "parsbench/ui/static/**/*", format = ["sdist", "wheel"] }]

[tool.poetry.scripts]
parsbench = "parsbench.cli:main"

[tool.poetry.dependencies]
# hazm >=0.11 requires Python >=3.12 and numpy 2.x; that sets the floor here.
python = ">=3.12,<3.14"
transformers = ">=4.42.3,<6.0.0"
openai = ">=1.35.10,<3.0.0"
jsonlines = "^4.0.0"
scikit-learn = "^1.5.1"
hazm = "^0.12.1"
datasets = ">=2.20.0,<6.0.0"
anthropic = ">=0.30.1,<1.0.0"
rouge-score = "^0.1.2"
# Imported directly in the code; declare them instead of relying on transitive installs.
numpy = ">=1.26"
pandas = ">=2.0"
requests = ">=2.28"
tqdm = ">=4.64"
nltk = ">=3.8"
# `parsbench test` wraps pytest; end users opt in with parsbench[test]
pytest = {version = ">=8.0", optional = true}

[tool.poetry.extras]
test = ["pytest"]


[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
black = "^24.4.2"
isort = "^5.13.2"
jupyter = "^1.0.0"
mypy = "^1.10.0"
mkdocs-material = "^9.5.27"
mkdocstrings = {version = ">=0.26", extras = ["python"]}
# math_equivalence (Persian Math task scorer) is an optional manual install — its
# git repo has no poetry-resolvable metadata. Install with:
#   pip install git+https://github.com/hendrycks/math.git
matplotlib = "^3.9.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
